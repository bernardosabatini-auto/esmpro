# GA_24 supernatant after the HSPB1 IP, 1 MS injection per BR.
name: GA24S
title: GA_24 post-IP supernatant (unbound fraction)
format: diann
source: pd_data/GA_24_Proteome_report_out.tsv
pattern: 'GA_24_HSPB1_37_(?P<cof>CTRL|NADP|NAD)_(?P<conc>[\d.]+)_KCl_(?P<KCl>[\d.]+)_BR(?P<BR>\d+)_TR\d+'
condition: [cof, conc, KCl]
numeric: []
contrasts:
  KCl60_ctrl: ["CTRL|0|60", "CTRL|0|0"]
  KCl120_ctrl: ["CTRL|0|120", "CTRL|0|0"]
  NADP0.6_KCl0: ["NADP|0.6|0", "CTRL|0|0"]
  NADP15_KCl0: ["NADP|15|0", "CTRL|0|0"]
  NAD11_KCl0: ["NAD|11|0", "CTRL|0|0"]
  NAD300_KCl0: ["NAD|300|0", "CTRL|0|0"]
  NADP15_KCl120: ["NADP|15|120", "CTRL|0|120"]
  NAD300_KCl120: ["NAD|300|120", "CTRL|0|120"]
# BR5 at KCl 120 fails the leave-one-out sample check in all five arms (r -0.38 to +0.04; median sample 0.74):
# a handling failure of that BR x salt block, so the block is dropped.
exclude: ["CTRL_0_120_5", "NADP_0.6_120_5", "NADP_15_120_5", "NAD_11_120_5", "NAD_300_120_5"]
